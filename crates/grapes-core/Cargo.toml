[package]
name = "grapes-core"
version = "0.1.0"
edition = "2021"
description = "Workspace, filesystem identity, and reconciliation core for Grapes Album"
license = "GPL-3.0-only"

[dependencies]
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
file-id = "0.2.3"
notify = "8.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
