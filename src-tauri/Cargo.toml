[package]
name = "grapes"
version = "0.1.0"
description = "Grapes Album: local-first photo workspace"
authors = ["Grapesea"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "grapes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
grapes-core = { path = "../crates/grapes-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
